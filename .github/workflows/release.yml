name: release

# Every push to main that changes the game, once the tests pass, becomes a
# release: Linux and Windows builds, each smoke-tested on its own system (a
# Windows runner starts the .exe), published on GitHub with notes. /releases/latest always has the newest build, and the game's main
# menu tells players when there's one newer than theirs (src/ui/update_check.gd).
# Versions: tools/release_version.py (v0.6.1, then v0.6.1.1, v0.6.1.2, ...).

on:
  workflow_run:
    workflows: [tests]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GODOT_VERSION: 4.6.2
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    outputs:
      release: ${{ steps.v.outputs.release }}
      version: ${{ steps.v.outputs.version }}
      previous: ${{ steps.v.outputs.previous }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SHA }}
          fetch-depth: 0

      - name: Anything new for players?
        id: v
        run: |
          # (a commit from before this pipeline existed has nothing to release; nor
          # does one whose workflows have since changed on main: GitHub won't let
          # this token tag it, and the newer commit's own run releases instead)
          git fetch -q origin main
          if [ ! -f tools/release_version.py ]; then echo "release=no" > version.txt
          elif ! git diff --quiet "$SHA" origin/main -- .github/workflows; then echo "release=no" > version.txt
          else python3 tools/release_version.py > version.txt; fi
          cat version.txt
          cat version.txt >> "$GITHUB_OUTPUT"

      - name: Export templates (cached)
        if: steps.v.outputs.release == 'yes'
        uses: actions/cache@v4
        with:
          path: ~/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.stable
          key: godot-templates-${{ env.GODOT_VERSION }}

      - name: Install Godot ${{ env.GODOT_VERSION }} and its export templates
        if: steps.v.outputs.release == 'yes'
        run: |
          wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q "Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot
          T=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          if [ ! -f "$T/linux_release.x86_64" ]; then
            wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
            unzip -q "Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
            mkdir -p "$T"
            mv templates/* "$T/"
          fi

      - name: Import, compress the model textures, import again
        if: steps.v.outputs.release == 'yes'
        run: |
          ./godot --headless --path . --import || true
          python3 tools/compress_textures.py
          ./godot --headless --path . --import || true

      - name: Export Linux and Windows (stamped v${{ steps.v.outputs.version }})
        if: steps.v.outputs.release == 'yes'
        run: |
          python3 tools/release_version.py --stamp "${{ steps.v.outputs.version }}"
          mkdir -p build/linux build/windows
          ./godot --headless --path . --export-release Linux build/linux/BunnyBeatDown.x86_64
          ./godot --headless --path . --export-release Windows build/windows/BunnyBeatDown.exe
          ls -la build/linux build/windows

      - name: Smoke test the Linux build (drop in and land)
        if: steps.v.outputs.release == 'yes'
        run: |
          BBD_TEST=1 timeout 300 build/linux/BunnyBeatDown.x86_64 --headless -- --smoke-test --map island | tee smoke.log
          grep -q "SMOKE TEST PASS" smoke.log

      - name: Package (Windows installer and zip, Linux folder with its launcher script)
        if: steps.v.outputs.release == 'yes'
        run: |
          # Linux: a BunnyBeatDown folder; its install.sh adds the menu entry and
          # the desktop launcher (tried here in a throwaway home first)
          mkdir -p pkg/BunnyBeatDown
          cp build/linux/BunnyBeatDown.x86_64 build/linux/BunnyBeatDown.pck pkg/BunnyBeatDown/
          cp tools/installer/install-linux.sh pkg/BunnyBeatDown/install.sh
          cp tools/installer/update-linux.sh pkg/BunnyBeatDown/update.sh
          cp icon.png pkg/BunnyBeatDown/bunny-beat-down.png
          echo "${{ steps.v.outputs.version }}" > pkg/BunnyBeatDown/version.txt
          mkdir -p /tmp/fakehome/Desktop
          HOME=/tmp/fakehome bash pkg/BunnyBeatDown/install.sh
          test -f /tmp/fakehome/Desktop/bunny-beat-down.desktop
          grep -q "Desktop Action update" /tmp/fakehome/Desktop/bunny-beat-down.desktop
          test -x "/tmp/fakehome/.local/share/nautilus/scripts/Update Bunny Beat Down"
          bash pkg/BunnyBeatDown/update.sh --check pkg/BunnyBeatDown
          (cd pkg && XZ_OPT="-6 -T0" tar -cJf ../BunnyBeatDown-linux-x86_64.tar.xz BunnyBeatDown)
          # Windows: the installer (desktop + Start menu shortcuts, an uninstaller),
          # and the portable zip (the game is inside the .exe, embed_pck, so a
          # copy of just the .exe still runs)
          sudo apt-get install -y -qq nsis > /dev/null
          makensis -V2 -DVERSION="${{ steps.v.outputs.version }}" -DEXE="$PWD/build/windows/BunnyBeatDown.exe" \
            -DOUT="$PWD/BunnyBeatDown-Setup-windows-x86_64.exe" tools/installer/windows.nsi
          (cd build/windows && zip -q -9 ../../BunnyBeatDown-windows-x86_64.zip BunnyBeatDown.exe)
          ls -la *.tar.xz *.zip *.exe

      - name: Keep the builds for the next jobs
        if: steps.v.outputs.release == 'yes'
        uses: actions/upload-artifact@v4
        with:
          name: builds
          path: |
            BunnyBeatDown-linux-x86_64.tar.xz
            BunnyBeatDown-windows-x86_64.zip
            BunnyBeatDown-Setup-windows-x86_64.exe
          retention-days: 2
          compression-level: 0

  windows:
    # the Windows build, started on Windows: the installer run silently (it
    # must leave a desktop shortcut), the installed game dropping in and
    # landing headless like the Linux one, then uninstalled; and the portable
    # .exe out of the zip
    needs: build
    if: needs.build.outputs.release == 'yes'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: builds
      - name: Install with the installer (silently) and check the shortcuts
        shell: pwsh
        run: |
          $p = Start-Process -FilePath ".\BunnyBeatDown-Setup-windows-x86_64.exe" -ArgumentList "/S" -PassThru -Wait
          Write-Host "installer exit: $($p.ExitCode)"
          $dir = Join-Path $env:LOCALAPPDATA "Programs\Bunny Beat Down"
          $desk = [Environment]::GetFolderPath("Desktop")
          $menu = Join-Path ([Environment]::GetFolderPath("Programs")) "Bunny Beat Down"
          Get-ChildItem $dir
          foreach ($f in @("$dir\BunnyBeatDown.exe", "$dir\Uninstall.exe", "$desk\Bunny Beat Down.lnk", "$menu\Bunny Beat Down.lnk")) {
            if (-not (Test-Path $f)) { throw "missing after install: $f" }
          }
          $lnk = (New-Object -ComObject WScript.Shell).CreateShortcut("$desk\Bunny Beat Down.lnk")
          Write-Host "desktop shortcut -> $($lnk.TargetPath) (icon $($lnk.IconLocation))"
          if ($lnk.TargetPath -ne "$dir\BunnyBeatDown.exe") { throw "the desktop shortcut points somewhere else" }
          # right-click on the desktop icon: "Update Bunny Beat Down", as the shell lists it
          $item = (New-Object -ComObject Shell.Application).Namespace($desk).ParseName("Bunny Beat Down.lnk")
          $verbs = @($item.Verbs() | ForEach-Object { $_.Name })
          Write-Host "desktop icon menu: $($verbs -join ' | ')"
          if (-not ($verbs | Where-Object { $_ -like "*Update Bunny Beat Down*" })) { throw "no Update on the desktop icon's menu" }
          if (-not (Test-Path "$menu\Update Bunny Beat Down.lnk")) { throw "no Update in the Start menu" }
          if (-not (Test-Path "$dir\update.ps1")) { throw "no update.ps1" }
          "WIN=$dir\BunnyBeatDown.exe" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Smoke test the installed game
        shell: pwsh
        run: |
          $env:BBD_TEST = "1"
          $p = Start-Process -FilePath $env:WIN -ArgumentList "--headless", "--", "--smoke-test", "--map", "island" `
            -PassThru -NoNewWindow -RedirectStandardOutput smoke.log -RedirectStandardError smoke_err.log
          if (-not $p.WaitForExit(900000)) { $p.Kill(); Write-Host "timed out" }
          # (what it printed, and the game's own log in its user folder, in case
          # a GUI .exe's output didn't reach the pipe)
          $logs = @("smoke.log", "smoke_err.log") + (Get-ChildItem "$env:APPDATA\Godot\app_userdata" -Recurse -Filter godot*.log -ErrorAction SilentlyContinue | ForEach-Object FullName)
          $passed = $false
          foreach ($l in $logs) {
            if (Test-Path $l) {
              Write-Host "== $l"; Get-Content $l -Tail 40
              if (Select-String -Path $l -Pattern "SMOKE TEST PASS" -Quiet) { $passed = $true }
            }
          }
          if (-not $passed) { throw "The Windows build didn't pass its smoke test" }
      - name: Update (an older install brought up to the newest release)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          BBD_TEST: "1"
        run: |
          $dir = Join-Path $env:LOCALAPPDATA "Programs\Bunny Beat Down"
          $key = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\BunnyBeatDown"
          powershell -NoProfile -ExecutionPolicy Bypass -File "$dir\update.ps1" -CheckOnly
          $latest = (gh release view --repo "${{ github.repository }}" --json tagName -q .tagName).TrimStart("v")
          $assets = @(gh release view --repo "${{ github.repository }}" --json assets -q ".assets[].name")
          if ($assets -contains "BunnyBeatDown-Setup-windows-x86_64.exe") {
            Set-ItemProperty $key -Name DisplayVersion -Value "0.0.1"   # (pretend it's old)
            powershell -NoProfile -ExecutionPolicy Bypass -File "$dir\update.ps1"
            $now = (Get-ItemProperty $key).DisplayVersion
            Write-Host "after the update: $now (latest release $latest)"
            if ($now -ne $latest) { throw "the update didn't install $latest" }
          } else {
            Write-Host "(the latest release, $latest, has no installer to update to yet)"
          }
      - name: Uninstall, and the portable zip
        shell: pwsh
        run: |
          $dir = Join-Path $env:LOCALAPPDATA "Programs\Bunny Beat Down"
          Start-Process -FilePath "$dir\Uninstall.exe" -ArgumentList "/S", "_?=$dir" -Wait
          $desk = [Environment]::GetFolderPath("Desktop")
          if (Test-Path "$desk\Bunny Beat Down.lnk") { throw "the uninstaller left the desktop shortcut" }
          if (Test-Path "$dir\BunnyBeatDown.exe") { throw "the uninstaller left the game" }
          Expand-Archive BunnyBeatDown-windows-x86_64.zip -DestinationPath win
          if (-not (Test-Path "win\BunnyBeatDown.exe")) { throw "the zip has no BunnyBeatDown.exe" }
          Write-Host "uninstalled cleanly; the zip holds $((Get-ChildItem win).Name -join ', ')"

  publish:
    needs: [build, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SHA }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: builds
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${{ needs.build.outputs.version }}"
          python3 tools/release_notes.py "$V" "${{ needs.build.outputs.previous }}" > notes.md
          gh release create "v$V" --target "$SHA" --title "Bunny Beat Down v$V" --notes-file notes.md --latest \
            BunnyBeatDown-Setup-windows-x86_64.exe BunnyBeatDown-windows-x86_64.zip BunnyBeatDown-linux-x86_64.tar.xz docs/trailer*.mp4
