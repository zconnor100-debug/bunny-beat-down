name: release

# Every push to main that changes the game, once the tests pass, becomes a
# release: Linux and Windows builds, each smoke-tested on its own system (a
# Windows runner starts the .exe), published on GitHub with notes. /releases/latest always has the newest build, and the game's main
# menu tells players when there's one newer than theirs (src/ui/update_check.gd).
# Versions: tools/release_version.py (v0.6.1, then v0.6.1.1, v0.6.1.2, ...).

on:
  workflow_run:
    workflows: [tests]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GODOT_VERSION: 4.6.2
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    outputs:
      release: ${{ steps.v.outputs.release }}
      version: ${{ steps.v.outputs.version }}
      previous: ${{ steps.v.outputs.previous }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SHA }}
          fetch-depth: 0

      - name: Anything new for players?
        id: v
        run: |
          # (a commit from before this pipeline existed has nothing to release; nor
          # does one whose workflows have since changed on main: GitHub won't let
          # this token tag it, and the newer commit's own run releases instead)
          git fetch -q origin main
          if [ ! -f tools/release_version.py ]; then echo "release=no" > version.txt
          elif ! git diff --quiet "$SHA" origin/main -- .github/workflows; then echo "release=no" > version.txt
          else python3 tools/release_version.py > version.txt; fi
          cat version.txt
          cat version.txt >> "$GITHUB_OUTPUT"

      - name: Export templates (cached)
        if: steps.v.outputs.release == 'yes'
        uses: actions/cache@v4
        with:
          path: ~/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.stable
          key: godot-templates-${{ env.GODOT_VERSION }}

      - name: Install Godot ${{ env.GODOT_VERSION }} and its export templates
        if: steps.v.outputs.release == 'yes'
        run: |
          wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q "Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot
          T=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          if [ ! -f "$T/linux_release.x86_64" ]; then
            wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
            unzip -q "Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
            mkdir -p "$T"
            mv templates/* "$T/"
          fi

      - name: Import, compress the model textures, import again
        if: steps.v.outputs.release == 'yes'
        run: |
          ./godot --headless --path . --import || true
          python3 tools/compress_textures.py
          ./godot --headless --path . --import || true

      - name: Export Linux and Windows (stamped v${{ steps.v.outputs.version }})
        if: steps.v.outputs.release == 'yes'
        run: |
          python3 tools/release_version.py --stamp "${{ steps.v.outputs.version }}"
          mkdir -p build/linux build/windows
          ./godot --headless --path . --export-release Linux build/linux/BunnyBeatDown.x86_64
          ./godot --headless --path . --export-release Windows build/windows/BunnyBeatDown.exe
          ls -la build/linux build/windows

      - name: Smoke test the Linux build (drop in and land)
        if: steps.v.outputs.release == 'yes'
        run: |
          BBD_TEST=1 timeout 300 build/linux/BunnyBeatDown.x86_64 --headless -- --smoke-test --map island | tee smoke.log
          grep -q "SMOKE TEST PASS" smoke.log

      - name: Package
        if: steps.v.outputs.release == 'yes'
        run: |
          (cd build/linux && XZ_OPT="-6 -T0" tar -cJf ../../BunnyBeatDown-linux-x86_64.tar.xz BunnyBeatDown.x86_64 BunnyBeatDown.pck)
          # (Windows: the game is inside the .exe, embed_pck, so a copy of just the
          # .exe dragged out of the zip still runs)
          (cd build/windows && zip -q -9 ../../BunnyBeatDown-windows-x86_64.zip BunnyBeatDown.exe)
          ls -la *.tar.xz *.zip

      - name: Keep the builds for the next jobs
        if: steps.v.outputs.release == 'yes'
        uses: actions/upload-artifact@v4
        with:
          name: builds
          path: |
            BunnyBeatDown-linux-x86_64.tar.xz
            BunnyBeatDown-windows-x86_64.zip
          retention-days: 2
          compression-level: 0

  windows:
    # the Windows build, started on Windows: just the .exe out of the zip (the
    # game is inside it), headless, dropping in and landing like the Linux one
    needs: build
    if: needs.build.outputs.release == 'yes'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: builds
      - name: Smoke test the Windows build
        shell: pwsh
        run: |
          Expand-Archive BunnyBeatDown-windows-x86_64.zip -DestinationPath win
          Get-ChildItem win
          $env:BBD_TEST = "1"
          $p = Start-Process -FilePath "win\BunnyBeatDown.exe" -ArgumentList "--headless", "--", "--smoke-test", "--map", "island" `
            -PassThru -NoNewWindow -RedirectStandardOutput smoke.log -RedirectStandardError smoke_err.log
          if (-not $p.WaitForExit(900000)) { $p.Kill(); Write-Host "timed out" }
          # (what it printed, and the game's own log in its user folder, in case
          # a GUI .exe's output didn't reach the pipe)
          $logs = @("smoke.log", "smoke_err.log") + (Get-ChildItem "$env:APPDATA\Godot\app_userdata" -Recurse -Filter godot*.log -ErrorAction SilentlyContinue | ForEach-Object FullName)
          $passed = $false
          foreach ($l in $logs) {
            if (Test-Path $l) {
              Write-Host "== $l"; Get-Content $l -Tail 40
              if (Select-String -Path $l -Pattern "SMOKE TEST PASS" -Quiet) { $passed = $true }
            }
          }
          if (-not $passed) { throw "The Windows build didn't pass its smoke test" }

  publish:
    needs: [build, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SHA }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: builds
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${{ needs.build.outputs.version }}"
          python3 tools/release_notes.py "$V" "${{ needs.build.outputs.previous }}" > notes.md
          gh release create "v$V" --target "$SHA" --title "Bunny Beat Down v$V" --notes-file notes.md --latest \
            BunnyBeatDown-linux-x86_64.tar.xz BunnyBeatDown-windows-x86_64.zip docs/trailer*.mp4
